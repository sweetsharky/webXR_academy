
<!DOCTYPE html>
<html lang="en">
<head>
  <title>WikingAR – WebXR</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="style.css" />
  
  <!-- Lösung für ein FAllstrick beim Arbeiten mit ES-Modulen(Module die eigentlich nur über Node.js direkt verlinkt werden können): Mit der import Map versteht der Browser nun, was "three" bedeutet. Damit three nicht als bare specifier erkannt wird, sondern das entsprechende Modul beinhaltet (das Modul soll ja über eine URL als CDN geteilt werden. Die zeichenkette "three" würde der Browser nicht als Modul verstehen, da ich hier nicht npm mit build tool (bundler) nutze, sondern three.js als CDN importiere. Importmaps sagen also: Hey Browser, wenn du die Zeichenkette "three" siehst oder andere, die in import Map stehen, dann lade den entsprechenden CDN-Link und binde so das Modul in das Projekt ein" )
  Die Import Map sagt dem Browser:
  „Wenn du die Zeichenkette three siehst, dann lade stattdessen diese URL.“ 
  Ist wichtig, damit die Importe von THREE.js über den Browser funktinieren, zB:
  import * as THREE from 'three';
  import { ARButton } from 'three/examples/jsm/webxr/ARButton.js';
  import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js"
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.133.0/build/three.module.js",
      "three/examples/jsm/": "https://unpkg.com/three@0.133.0/examples/jsm/"
    }
  }
  </script>
  <!-- 
  Nur das Main-Modul einbinden.
        - Alle weiteren Imports (Three.js, GLTFLoader, ARButton, usw.) passieren innerhalb der JS-Module.
        - type="module" sagt, dass dieses Skript wie ein Modul gehandhabt werden soll, und somit erst nach dem Laden der HTML-Elemente geladen werden soll. (Man könnte es auch ganz nach unten schreiben, am Ende des body, aber ist wohl best-pracice so, aus Gründen)
        --> 
  <script type="module" src="js/main.js"></script>

</head>

    </div>

        Dein Browser unterstützt kein HTML5-Video.
      </video>

        <button id="continueButton_nietVideo">Skip</button>
      </div>

  </div>

    
  <div class="item3">
    <div class="icon-column">
    <!--  <button class="icon-btn" data-action="showNiet">
        <img src="/webXR_academy/staticfiles/images/logo_schrift.svg" alt="Icon Niet" width="20"/>
      </button>
      <button class="icon-btn" data-action="showShip">
        <img src="/webXR_academy/staticfiles/images/logo_schrift.svg" alt="Icon Schiff" width="20"/>
      </button> -->
      <button class="icon-btn" data-action="showFeuerstahl">
        <img src="/webXR_academy/staticfiles/images/feuerstahlbeschlag_duisburg_einzeln.svg" alt="Feuerstahlbeschlag" width="24"/>
      </button>
        <!-- Modell-Toggles -->
        <button id="toggle-nietplatte">Nietplatte an/aus</button>

        <button id="toggle-nietplatte-rost">NietplatteRost an/aus</button>
        <button id="toggle-schiffsniet">Schiffsniet an/aus</button>

    </div>
